# ==============================================================================
# 🐱 Kitty Terminal Configuration - Pro Edition
# ==============================================================================

# --- 1. Phông chữ (Fonts & Ligatures) ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# Kích hoạt ký tự nối code (=>, !=, ===, ->)
disable_ligatures never

# --- 2. Tối ưu hiệu năng & Triệt tiêu độ trễ (Zero-lag Performance) ---
# Tinh hoa từ các dotfiles hàng đầu: giảm độ trễ phản hồi phím và render mượt mà
repaint_delay    10
input_delay      3
sync_to_monitor  yes

# --- 3. Giao diện, Trong suốt & Bo viền (Window & Aesthetic) ---
# Độ trong suốt và làm mờ nền (hỗ trợ tuyệt vời trên KDE Plasma Wayland)
background_opacity 0.92
background_blur    1

# Đệm viền lề (tránh chữ bị dính sát mép màn hình)
window_padding_width 10

# Tắt tiếng kêu "bíp" chói tai của hệ thống
enable_audio_bell no

# Đóng cửa sổ không hiện popup hỏi xác nhận
confirm_os_window_close 0

# --- 4. Con trỏ & Hiệu ứng Vệt sáng Ma mị (Cursor & Trail) ---
cursor_shape          beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.5

# Hiệu ứng Cursor Trail cực hot trên r/unixporn
cursor_trail          3
cursor_trail_decay    0.1 0.4

# --- 5. Tương tác Chuột & URL ---
url_style        curly
open_url_with    default
# Bôi đen bằng chuột là tự động COPY ngay vào Clipboard
copy_on_select   yes

# --- 6. Thanh Tab (Tab Bar) ---
tab_bar_edge        top
tab_bar_style       powerline
tab_powerline_style slanted

# --- 7. Tích hợp Shell Thông Minh (Shell Integration) ---
shell_integration enabled

# --- 8. Hệ thống Phím tắt Cực Tiện (Keybindings) ---
# Phím tắt chỉnh cỡ chữ
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0     change_font_size all 0

# Tải lại cấu hình tức thì
map ctrl+shift+f5 load_config_file

# Quản lý Tab nhanh
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+tab       next_tab
map ctrl+shift+tab previous_tab

# --- 9. Vũ khí Bí Mật: Kitty Hints Kittens (Thao tác không cần chuột) ---
# Bấm Ctrl+Shift+E: Hiện ký tự để chọn và mở URL trên màn hình
map ctrl+shift+e open_url_with_hints

# Bấm Ctrl+Shift+P rồi bấm F: Chọn và copy đường dẫn file (path) trên terminal
map ctrl+shift+p>f kitten hints --type path --program @

# Bấm Ctrl+Shift+P rồi bấm H: Chọn và copy mã Git Commit Hash
map ctrl+shift+p>h kitten hints --type hash --program @

# Bấm Ctrl+Shift+P rồi bấm L: Chọn và copy nguyên cả 1 dòng text
map ctrl+shift+p>l kitten hints --type line --program @

# ==============================================================================
# Theme cài đặt qua "kitty +kitten themes"
# ==============================================================================
# BEGIN_KITTY_THEME
# Aquarium Dark
include current-theme.conf
# END_KITTY_THEME